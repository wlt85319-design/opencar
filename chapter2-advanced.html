center}.cc img{width:52px;height:52px;border-radius:50%;border:2px solid var(--lime);object-fit:cover}.coach-box{margin-top:22px;padding:16px;border-radius:16px;background:#fff;border:1px solid var(--line)}.coach-box b{display:block;margin-bottom:8px}.portal{margin-top:16px;border:1px solid #cbd6ff;background:#f2f4ff;border-radius:16px;padding:16px}.portal span{font-size:12px;color:var(--blue);font-weight:900}.portal button{border:0;background:transparent;padding:8px 0 0;color:var(--blue);font-weight:900;cursor:pointer}.portal-detail{margin-top:10px;padding-top:10px;border-top:1px solid #dbe0ff;font-size:14px;line-height:1.6}@media(max-width:980px){.shell{grid-template-columns:180px 1fr}.coach{grid-column:1/-1;border-top:1px solid var(--line);border-left:0}.answers{grid-template-columns:1fr}}@media(max-width:680px){.shell{display:block}.rail{padding:16px}.missions{grid-template-columns:repeat(3,1fr)}.missions button{display:block;text-align:center}.missions button span{display:block;font-size:12px;margin-top:5px}main{padding:18px}.heading h1{font-size:29px}.scene{height:250px}.math-core{gap:8px}.orb{width:68px;height:68px}.beam{width:55px}.top nav a:first-child{display:none}}
</style><link rel="icon" type="image/png" href="./yuanlai-app-icon.png"><link rel="stylesheet" href="./brand-logo.css"></head><body><header class="top"><a class="brand" href="./index.html"><img class="brand-logo" src="./yuanlai-header-logo-transparent.png" alt="元来Lab"></a><nav><a href="./course.html">返回第二章</a><a href="./index.html">课程目录</a></nav></header><div class="shell"><aside class="rail"><span>CHAPTER 02 · 进阶段</span><h2>能量核心修复</h2><p>按教材顺序完成除法、乘方和混合运算。</p><div class="missions" id="missions"></div></aside><main><div class="heading"><div><div class="kicker" id="code">MISSION 05</div><h1 id="title">有理数的除法</h1><p id="goal"></p></div></div><section class="scene" id="scene"><small>ZERO OBSERVATORY · ENERGY CORE</small><h2 id="sceneTitle"></h2><div class="math-core"><div class="orb" id="leftOrb">−12</div><div class="beam"></div><div class="orb result" id="resultOrb">?</div></div></section><section class="card"><div class="steps"><span class="active">1 作答</span><span>2 解释</span><span>3 迁移</span></div><small class="kicker" id="tag"></small><h2 id="question"></h2><p id="prompt"></p><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback"></div><button class="next hidden" id="next">继续 →</button></section></main><aside class="coach"><div class="cc"><img src="./miao-cc.png" alt="喵伯爵头像"><div><b>喵伯爵</b><small>AI 概念教练</small></div></div><div class="coach-box"><b>本关不是背口诀</b><p id="coachText"></p></div><div class="portal"><span>✦ 可选知识传送门</span><h3 id="portalTitle"></h3><p id="portalCopy"></p><button id="portalBtn">打开支线探索 →</button><div class="portal-detail hidden" id="portalDetail"></div></div></aside></div><script>
const units=window.CHAPTER2_FULL||[
 {code:'2.2.2 · 01',title:'除法：逆运算',goal:'从乘法的逆运算理解除法，判断商的符号与绝对值。',scene:'能量分配器：把 −12 平均分成 3 份',q:'−12 ÷ (+3) 的结果是多少？',opts:['−4','+4','−9'],a:0,explain:'异号相除，商为负；12÷3=4，所以结果是−4。',coach:'先判断符号，再处理绝对值；除法和乘法互为逆运算。',portal:['物理支线：速度','路程÷时间=速度。若用正负号表示运动方向，平均速度也会带方向。','高中物理中“速度”是矢量。−12米÷3秒=−4米/秒，负号表示选定正方向的反方向。']},
 {code:'2.2.2 · 02',title:'除法：倒数',goal:'理解除以一个不为0的数，等于乘这个数的倒数。',scene:'倒数转换门：除法正在改写为乘法',q:'−3/5 ÷ (−9/10) 应改写成哪一个乘法？',opts:['−3/5×(−10/9)','−3/5×(−9/10)','3/5×9/10'],a:0,explain:'除以−9/10等于乘它的倒数−10/9，原数−3/5不变。',coach:'只对除数取倒数，不能把被除数一起颠倒；除数不能为0。',portal:['科学支线：频率与周期','物理中的频率和周期互为倒数，这是“倒数关系”的真实应用。','高中物理中频率 f=1/T。周期越短，单位时间内重复次数越多。']},
 {code:'2.3 · 01',title:'乘方：重复因数',goal:'分清底数、指数和幂，理解乘方表示相同因数的乘积。',scene:'指数增幅器：让相同因数连续作用',q:'(−2)³表示什么？',opts:['(−2)×(−2)×(−2)','−2×3','−(2×2)'],a:0,explain:'指数3表示三个−2相乘，结果为−8。括号决定负号属于底数。',coach:'乘方不是乘以指数；指数记录相同因数出现的次数。',portal:['生物支线：细胞倍增','细胞按固定倍数分裂时，数量会以乘方速度增长。','如果每轮数量翻倍，经过n轮就是初始数量×2ⁿ，这也是指数增长的入口。']},
 {code:'2.3 · 02',title:'乘方：符号陷阱',goal:'辨别−2²与(−2)²，掌握负数幂的奇偶规律。',scene:'括号识别器：检测负号是否属于底数',q:'−2² 与 (−2)² 的结果分别是？',opts:['−4，+4','+4，+4','−4，−4'],a:0,explain:'−2²=−(2²)=−4；(−2)²中底数是−2，结果为+4。',coach:'先看底数范围，再做乘方，最后处理括号外的符号。',portal:['高中预览：指数函数','乘方会继续发展为指数函数，用来描述快速增长与衰减。','高中会研究y=aˣ。它可以描述复利、人口增长、放射性衰减等变化。']},
 {code:'2.4 · 01',title:'科学记数法',goal:'把大于10的数写成a×10ⁿ，并正确确定n。',scene:'星际数据压缩器：压缩巨大数量级',q:'3 800 000用科学记数法表示为？',opts:['3.8×10⁶','38×10⁵','0.38×10⁷'],a:0,explain:'规范形式要求1≤a<10，因此写成3.8×10⁶。',coach:'小数点移动几位，10的指数就是几；同时检查a必须在1到10之间。',portal:['天文支线：宇宙尺度','天文距离非常大，科学记数法能让数量级一眼可见。','光速约为3×10⁸米/秒；科学记数法让我们能方便比较行星、恒星与星系尺度。']},
 {code:'2.4 · 02',title:'混合运算终局',goal:'遵守运算顺序，正确处理乘方、括号、乘除与加减。',scene:'中央核心：六级运算顺序同时上线',q:'−2² + 3×(−4) − (−6)÷2 的结果是？',opts:['−13','−19','+11'],a:0,explain:'先乘方得−4；乘法得−12；除法得−3。原式=−4−12−(−3)=−13。',coach:'先乘方，再乘除，最后加减；同级运算从左到右，括号最优先。',portal:['编程支线：表达式求值','计算机也必须按照确定的优先级解析表达式。','程序语言会用语法树确定运算顺序。括号改变结构，而不仅是视觉装饰。']}
];let current=0,answered=false;const $=id=>document.getElementById(id);function renderNav(){$('missions').innerHTML=units.map((u,i)=>`<button class="${i===current?'active':''}" data-i="${i}"><i>${String(i+1).padStart(2,'0')}</i><span>${u.title}</span></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{current=+b.dataset.i;render()})}function render(){answered=false;const u=units[current];renderNav();$('code').textContent=u.code;$('title').textContent=u.title;$('goal').textContent=u.goal;$('sceneTitle').textContent=u.scene;$('tag').textContent='概念验证';$('question').textContent=u.q;$('prompt').textContent='先独立判断，再听喵伯爵解释理由。';$('coachText').textContent=u.coach;$('portalTitle').textContent=u.portal[0];$('portalCopy').textContent=u.portal[1];$('portalDetail').textContent=u.portal[2];$('portalDetail').classList.add('hidden');$('portalBtn').textContent='打开支线探索 →';$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('scene').classList.remove('activated');$('leftOrb').textContent=u.q.split(' ')[0];$('resultOrb').textContent='?';$('answers').innerHTML=u.opts.map((x,i)=>`<button data-a="${i}">${x}</button>`).join('');document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>answer(+b.dataset.a,b))}function answer(i,b){if(answered)return;if(i!==units[current].a){b.classList.add('wrong');$('coachText').textContent='先回到这一关的关键条件：'+units[current].coach;return}answered=true;b.classList.add('correct');document.querySelectorAll('[data-a]').forEach(x=>x.disabled=true);$('feedback').textContent=units[current].explain;$('feedback').classList.remove('hidden');$('scene').classList.add('activated');$('resultOrb').textContent=units[current].opts[units[current].a].split('，')[0];$('next').classList.remove('hidden')}$('next').onclick=()=>{current=(current+1)%units.length;render()};$('portalBtn').onclick=()=>{const open=$('portalDetail').classList.toggle('hidden');$('portalBtn').textContent=open?'打开支线探索 →':'收起支线 ↑'};render();
